name: Python build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check Python version
        run: python --version

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Check pytest version
        run: pytest --version

      - name: Run the program
        run: python maths/fibonacci.py 30

      - name: Run tests and generate XML xUnit-style report
        run: pytest --junit-xml=report.xml

      - name: Show XML report
        if: always()
        run: cat report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-py${{ matrix.python-version }}
          path: report.xml
